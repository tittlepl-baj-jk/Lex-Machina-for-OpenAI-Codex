    - SD-VER-GATE-WITNESS
    - PRAWO-HARDGATE
    - PRIOR-TESTIMONY-GATE
    - WITNESS-TYPE-GATE
    - INTAKE-COMPLETENESS-GATE
    - QUESTION-ADMISSIBILITY-GATE
    - WITNESS-SCORING
    - WITNESS-INTELLIGENCE
    - FACT-EVIDENCE-MAPPING
    - MODEL-SELECTION-GATE
    - CROSS-EXAMINATION-GATE
    - TEXT-FIRST-UI-GATE
    - HARDGATE-SD-01
    - HARDGATE-SD-02
    - RZ-SHOW-GATE
    - STEP-TRACKER-WITNESS
    - PRZESLANKI-GATE
    - FORMALNA-ZGODNOSC-GATE
pipeline:
  stages:
    - PRE-W1a-SD-VER
    - PRE-W1a.4-RZ-SHOW
    - KROK-PRE-W1-INTELLIGENCE
    - KROK-0-KONTEKST
    - W1-INTAKE
    - W1-SUPPLEMENT
    - W2-THESES-AND-MODEL
    - CHECKPOINT-W2
    - W3-QUESTIONS
    - W4-REHEARSAL
    - W5-BINDER
    - W6-LIVE-DIRECT
